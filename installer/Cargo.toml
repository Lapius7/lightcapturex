[package]
name = "lightcapturex-installer"
version = "0.2.0"
edition = "2021"
description = "Installer for LightCaptureX"
license = "MIT"
repository = "https://github.com/Lapius7/lightcapturex"
authors = ["Lapius7 <me@lapius7.com>"]

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
